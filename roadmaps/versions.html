<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>招式地圖 · 十個版本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F3EC;--surface:#fff;--surface-2:#FBF9F4;--ink:#1B1E22;--muted:#6E6A62;
  --line:#E3DED3;--line-soft:#EEEAE1;--accent:#9A5B2E;--accent-soft:#F0E2D4;
  --ok:#2F7D62;--ok-bg:#E3F0EA;--warn:#A8761A;--warn-bg:#F6EBD4;
  --todo:#9AA0A8;--todo-bg:#ECEDEF;--miss:#A83A36;--miss-bg:#F6E0DE;
  --grad:#3B6EA8;--grad-bg:#E2EAF4;--spine:#CFC7B8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161A;--surface:#1C1F25;--surface-2:#20242B;--ink:#E9E5DC;--muted:#9A958B;
  --line:#2E333C;--line-soft:#262B33;--accent:#D79A5B;--accent-soft:#3A2D20;
  --ok:#58B08C;--ok-bg:#1B3029;--warn:#D9A441;--warn-bg:#352B14;
  --todo:#6E747E;--todo-bg:#252931;--miss:#D97672;--miss-bg:#36211F;
  --grad:#7FA8D9;--grad-bg:#1E2A38;--spine:#39404B;
}}
:root[data-theme="dark"]{
  --bg:#14161A;--surface:#1C1F25;--surface-2:#20242B;--ink:#E9E5DC;--muted:#9A958B;
  --line:#2E333C;--line-soft:#262B33;--accent:#D79A5B;--accent-soft:#3A2D20;
  --ok:#58B08C;--ok-bg:#1B3029;--warn:#D9A441;--warn-bg:#352B14;
  --todo:#6E747E;--todo-bg:#252931;--miss:#D97672;--miss-bg:#36211F;
  --grad:#7FA8D9;--grad-bg:#1E2A38;--spine:#39404B;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.nav a{font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--surface)}
.nav a.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.hd{margin:0 0 6px;font-size:clamp(22px,4vw,32px);font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 4px;max-width:66ch}
.kpi{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0 26px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.kpi b{font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s1 b{color:var(--ok)} .kpi .s2 b{color:var(--warn)} .kpi .s3 b{color:var(--miss)}
.lg{display:flex;gap:6px 9px;flex-wrap:wrap;margin:0 0 24px}
.lg span{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px}
.l-ok{background:var(--ok-bg);color:var(--ok)} .l-grad{background:var(--grad-bg);color:var(--grad)}
.l-warn{background:var(--warn-bg);color:var(--warn)} .l-todo{background:var(--todo-bg);color:var(--todo)}
.l-miss{background:var(--miss-bg);color:var(--miss)}
svg{display:block;width:100%;height:auto;overflow:visible}
.scroll{overflow-x:auto;padding-bottom:8px}
.ft{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.6}
.ft code{font-family:var(--mono);color:var(--accent)}

.pvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pv{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:16px;color:var(--ink)}
.pv:hover{border-color:var(--accent)}
.no{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em}
.pv b{display:block;font-size:17px;font-weight:700;margin:6px 0 5px;letter-spacing:-.01em}
.pv small{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
</style></head><body><div class="wrap">
